# SPDX-License-Identifier: AGPL-3.0-only
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:                          # accounts schema tests and the backup drill (F2, D70)
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pranix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PRANIX_EPHE_PATH: ${{ github.workspace }}/data/ephe
      PRANIX_FONTS_DIR: ${{ github.workspace }}/data/fonts
      PRANIX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pranix_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Ephemeris data (verified checksums)
        working-directory: .
        run: tools/fetch_ephe.sh && tools/fetch_fonts.sh
      - run: pip install -e ".[dev]"
      - name: SPDX headers
        working-directory: .
        run: python tools/check_spdx.py .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: lint-imports
      - run: pytest
      - name: Backup and restore drill on the test database (F2)
        working-directory: deploy/oracle
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          PRANIX_DATABASE_URL="$PRANIX_TEST_DATABASE_URL" pranix-ctl db upgrade
          openssl rand -hex 32 > /tmp/backup.key
          BACKUP_KEY_FILE=/tmp/backup.key BACKUP_TARGET=dir:/tmp/backups PGURL="$PRANIX_TEST_DATABASE_URL" ./backup.sh
          LOCAL_PG=1 BACKUP_KEY_FILE=/tmp/backup.key BACKUP_TARGET=dir:/tmp/backups ./restore_drill.sh
      - name: Contract and fixtures are current (F1)
        working-directory: .
        run: python tools/export_contract.py --check
      - name: Engine self-test
        run: pranix-ctl selftest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check:api
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    env:
      PRANIX_EPHE_PATH: ${{ github.workspace }}/data/ephe
      PRANIX_FONTS_DIR: ${{ github.workspace }}/data/fonts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: tools/fetch_ephe.sh && tools/fetch_fonts.sh
      - run: pip install -e "backend[dev]"
      - working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f infra/Dockerfile -t pranix:ci .
      - name: Smoke test (/readyz runs the golden self-test)
        run: |
          docker run -d --name pranix-smoke -p 8000:8000 pranix:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/readyz && break; sleep 1; done
          curl -fs localhost:8000/readyz
          curl -fs localhost:8000/version
          curl -fs localhost:8000/ | grep -q '<div id="root">' && echo "smoke: app shell ok"
          curl -fs localhost:8000/dashboard | grep -q '<div id="root">'
          curl -fsI localhost:8000/ | grep -qi content-security-policy
          curl -fs "localhost:8000/v1/places?q=pune" | python3 -c "import json,sys; r=json.load(sys.stdin); print(r[0]); assert r[0]['tz']=='Asia/Kolkata'"
          curl -fs "localhost:8000/v1/places/nearest?lat=18.55&lon=73.85"
          echo "smoke: places ok"
          curl -fs -X POST localhost:8000/v1/profiles -H "content-type: application/json" -H "X-Age-Confirmed: true" \
            -d '{"place":{"lat":18.5204,"lon":73.8567},"local_datetime":"1984-12-08T00:20:00","birth_time_known":true}' \
            | tee /tmp/p.json | python3 -c "import json,sys; m=json.load(sys.stdin)['master']; print(m['d1']['lagna']['sign'], m['nakshatra']['name']); assert m['d1']['lagna']['sign']=='Leo'"
          pid=$(python3 -c "import json; print(json.load(open('/tmp/p.json'))['profile_id'])")
          curl -fsN "localhost:8000/v1/profiles/$pid/insights" | tee /tmp/sse.txt | grep -c "^event: insight" | grep -qx 12
          grep "^event: done" /tmp/sse.txt
          curl -fs "localhost:8000/v1/profiles/$pid/dasha" | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d)==9; print('dasha', [p['lord'] for p in d])"
          curl -fs -o /tmp/card.png -w "card image %{http_code} %{content_type} %{size_download} bytes\n" "localhost:8000/v1/profiles/$pid/cards/birthstar.png"
          docker logs pranix-smoke
