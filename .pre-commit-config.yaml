# SPDX-License-Identifier: AGPL-3.0-only
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: spdx
        name: SPDX headers
        entry: python tools/check_spdx.py .
        language: system
        pass_filenames: false
