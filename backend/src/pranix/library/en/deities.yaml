# DRAFT library: deity essences, qualities and a reflective practice. Respectful, non-devotional framing.
Shiva: {status: draft, essence: "Shiva is honoured as stillness and transformation, the calm that lets the old fall away.", qualities: [Stillness, Letting go, Inner strength], practice: "Sit quietly for a few minutes and let one worry go with each out-breath."}
Gauri: {status: draft, essence: "Gauri (Parvati) is honoured as devotion, nurture and quiet strength that never gives up.", qualities: [Devotion, Gentle strength, Patience], practice: "Offer one act of care each day, to someone else or to yourself, with full attention."}
Skanda: {status: draft, essence: "Skanda (Kartikeya) is honoured as youthful courage and clear purpose that cuts through confusion.", qualities: [Courage, Focus, Discipline], practice: "Choose one task you have avoided and give it your full effort for a short time."}
Vishnu: {status: draft, essence: "Vishnu is honoured as the preserver, keeping balance and protecting what is good.", qualities: [Balance, Protection, Steadiness], practice: "Notice what keeps your life steady and thank it, in words or in silence."}
Sambasiva: {status: draft, essence: "Sambasiva, Shiva together with Parvati, is honoured as the union of stillness and care.", qualities: [Wholeness, Harmony, Wisdom], practice: "Balance one busy hour with one quiet one today."}
Lakshmi: {status: draft, essence: "Lakshmi is honoured as grace, abundance and the beauty of a well-kept life.", qualities: [Gratitude, Generosity, Grace], practice: "Write down three things you are grateful for before you sleep."}
Durga: {status: draft, essence: "Durga is honoured as protective strength that faces difficulty without fear.", qualities: [Courage, Protection, Resolve], practice: "Name one fear and one small step that would make it smaller."}
Ganesha: {status: draft, essence: "Ganesha is honoured as the remover of obstacles and the wisdom of beginnings.", qualities: [Wisdom, Patience, Good beginnings], practice: "Before starting something new, pause and set a clear, kind intention."}
Rama: {status: draft, essence: "Rama is honoured as integrity and keeping one's word.", qualities: [Integrity, Duty, Kindness], practice: "Keep one small promise today, especially one made to yourself."}
Krishna: {status: draft, essence: "Krishna is honoured as joyful love and wise guidance.", qualities: [Joy, Love, Wisdom], practice: "Bring music or play into your day, even briefly."}
Hanuman: {status: draft, essence: "Hanuman is honoured as devoted strength and tireless service.", qualities: [Devotion, Strength, Humility], practice: "Help someone quietly without telling anyone."}
Narasimha: {status: draft, essence: "Narasimha is honoured as fierce protection of the innocent.", qualities: [Protection, Courage, Justice], practice: "Stand up kindly for someone, or for yourself, in a small way."}
Dattatreya: {status: draft, essence: "Dattatreya is honoured as the teacher who learns from everything around.", qualities: [Learning, Openness, Simplicity], practice: "Notice one lesson that nature or a stranger teaches you today."}
