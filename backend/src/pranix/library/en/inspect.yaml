# Chart Inspector wording (I1). Approved by the owner: the summary line in the prototype review
# (25 Nov 2026) and the dignity glosses in D81 §3 (26 Nov 2026). No numerals (rule 2); calm tone (rule 13).
status: approved
reviewed: "D81"
ordinals: [first, second, third, fourth, fifth, sixth, seventh, eighth, ninth, tenth, eleventh, twelfth]
dignity_phrase:
  own: "its own sign"
  exalted: "where it is exalted"
  debilitated: "where it is debilitated"
  friend: "a friend's sign"
  enemy: "an enemy's sign"
  neutral: "a neutral sign"
glosses:
  enemy: "Enemy's sign: less natural comfort here, so it takes more conscious effort."
  debilitated: "Debilitated: unfamiliar ground. Always read it alongside the {other} and its dispositor support."
  debilitated_sign_level: "Debilitated: unfamiliar ground. Always read it alongside its dispositor support."
  node: "Shadow node: read through the lord of its sign."
house_words: [one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve]
summary:
  house: "{planet} in your {ordinal} house, in {sign}{dignity}."
  house_target: "{rising}House {word} is {sign}{occupants}."
  house_target_rising: "Your rising sign. "
  house_target_with: ", with {names}"
  house_target_empty: ". It is empty, so it is read through its lord"
  house_target_empty_looked: ". It is empty, so it is read through its lord and the planets that look at it"
  sign: "{planet} in {sign}{dignity}."
  sign_uncertain: "{planet} in {options}, depending on the birth time."
# D83 (26 Nov 2026): signs that could differ within the birth time's own margin. Calm, no numerals.
minute:
  rising_d1: "Within your birth time's margin, your rising sign could be {options}, which would move every house."
  rising_d9: "Within your birth time's margin, your D9 rising sign could be {options}, which would move the D9 houses."
  planet_d9: "Within your birth time's margin, {planet}'s D9 sign could be {options}."
  two: "{a} or {b}"
  many: "any of several signs from {first} to {last}"

