# APPROVED library batch 2 (owner, 20 Nov 2026, D69): naming syllables card. Framed as a custom, never a judgement on a name (FR-SAF-05).
status: approved
intro: "In Indian tradition a child's name often begins with a sound linked to the quarter of the birth star the Moon was in."
known: "Your quarter's sound is highlighted. The other three belong to the same star."
unknown: "Without a birth time we cannot tell which quarter, so all four sounds of your star are shown equally."
changed: "The Moon changed star during your birth day, so both stars' sounds are shown."
note_match: "Your name begins with one of these sounds, a nice echo of the tradition."
