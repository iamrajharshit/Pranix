# Change text through the review sheet, not by hand (plan section 18).
house_1: {status: "approved", arena: "The first house is the self: your body, temperament and the way you meet the world.", healthy: "At its best it gives a steady sense of who you are and the confidence to begin things in your own way.", growth: "Growth here means letting your self-image breathe, so being yourself never depends on being seen."}
house_2: {status: "approved", arena: "The second house holds what sustains you: resources, family ties, speech and the values you live by.", healthy: "When it flows well there is a calm relationship with what you have, and words that nourish rather than wound.", growth: "The growth edge is building security on your values, not only on what you can count or keep."}
house_3: {status: "approved", arena: "The third house is courage in everyday form: effort, skills, short journeys, siblings and how you communicate.", healthy: "Lived well, it shows as initiative, curiosity and the nerve to try, learn and speak up.", growth: "Growth comes from finishing what you start and letting steady practice carry you further than bursts of effort."}
house_4: {status: "approved", arena: "The fourth house is home and roots: inner peace, family background, comfort and a sense of belonging.", healthy: "At its best it gives you a quiet inner base to return to, wherever life takes you.", growth: "Growth here means creating the safety you need from within, rather than waiting for circumstances to supply it."}
house_5: {status: "approved", arena: "The fifth house is creative joy: learning, play, romance, children and the ideas you bring to life.", healthy: "When it flows well it shows as playful intelligence and a heart that gives freely to what it loves.", growth: "The growth edge is creating for the joy of it, without needing applause to feel your work matters."}
house_6: {status: "approved", arena: "The sixth house is the daily round: work routines, service, habits of wellbeing and how you meet obstacles.", healthy: "Lived well, it brings steady discipline, practical skill and a calm way of handling friction.", growth: "Growth comes from tending your routines with patience, so effort feels like devotion rather than strain."}
house_7: {status: "approved", arena: "The seventh house is partnership: close one-to-one bonds, marriage, agreements and meeting others as equals.", healthy: "At its best it shows as fair give and take, and seeing yourself more clearly through another person.", growth: "Growth here means staying yourself inside a bond while making real room for someone else's way."}
house_8: {status: "approved", arena: "The eighth house is depth and change: shared resources, the hidden side of life and the turning points that renew you.", healthy: "When it flows well it brings resilience, a researcher's curiosity and the courage to look beneath the surface.", growth: "The growth edge is trusting change: letting go of what is finished so that something truer can grow."}
house_9: {status: "approved", arena: "The ninth house is meaning: higher learning, teachers, faith, long journeys and the principles that guide you.", healthy: "Lived well, it shows as an open, generous outlook and a sense of purpose larger than yourself.", growth: "Growth comes from holding your beliefs with humility and staying willing to learn from other paths."}
house_10: {status: "approved", arena: "The tenth house is your work in the world: career, reputation, responsibility and what you build in public.", healthy: "At its best it brings purposeful ambition and the steadiness to carry responsibility well.", growth: "Growth here means measuring success by what you contribute, not only by the recognition it brings."}
house_11: {status: "approved", arena: "The eleventh house is gains and community: friends, networks, hopes and the rewards of steady effort.", healthy: "When it flows well it shows as generous friendships and goals that lift others along with you.", growth: "The growth edge is choosing aims that truly matter to you, rather than collecting wins for their own sake."}
house_12: {status: "approved", arena: "The twelfth house is release: rest, solitude, spending, far places and the inner life beyond the everyday.", healthy: "Lived well, it brings restorative quiet, compassion and an easy relationship with letting go.", growth: "Growth comes from making time to withdraw and renew, so that retreat refreshes you instead of becoming escape."}
