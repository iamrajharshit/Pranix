Ashwini: {status: "approved", core: "You possess a nature marked by swift beginnings and vibrant energy. This placement highlights your capacity for dynamic and immediate action.", gifts: "You have a natural gift for offering quick assistance to others. This energy allows you to initiate projects with lively enthusiasm.", growth_edges: "Your speed can outrun your patience, pulling you toward the next spark before the current one lands. Practice pacing your haste so strong starts turn into finished work.", at_work: "In your professional life, you excel at launching new initiatives. You bring fresh vitality to tasks that require a rapid start.", in_relationships: "You bring candour, playful energy, and an instinct to show up fast when someone you care about needs you. You thrive in bonds that leave room for independence and fresh momentum.", practice: "Pick one small task you already started and carry it all the way to a clean finish before opening anything new. Notice the quiet satisfaction of completion alongside speed."}
Bharani: {status: "approved", core: "You possess an essential nature rooted in carrying and profound transformation. You hold strong emotions and the quiet courage to move through significant changes.", gifts: "You naturally gain endurance when facing intense pressure. This inner strength allows you to persevere through challenging circumstances.", growth_edges: "You may find invitations to share your burdens rather than carrying them entirely by yourself. Allowing support can amplify your capacity for change.", at_work: "In your professional life, you show a deep capacity to handle complex situations. You can transform obstacles into foundational learning experiences.", in_relationships: "You offer deep feeling and loyalty to those you connect with. You seek meaningful bonds where you can share your inner world.", practice: "Name one heavy responsibility you have been holding silently this week and let someone you trust share part of it. Notice how releasing excess weight restores your creative strength."}
Krittika: {status: "approved", core: "You possess a nature defined by sharp, purifying fire. This energy grants you the clarity needed to see truth and cut away what is untrue.", gifts: "You naturally bring forth honesty and a clear perspective to your experiences. This allows you to shine a light on what truly matters.", growth_edges: "Be mindful of words that might cut too sharply in your expression. Gentle consideration helps ensure your honesty is always constructive.", at_work: "In your studies and professional endeavors, you excel at bringing forth direct insights. You have the ability to articulate complex ideas with precision.", in_relationships: "With those close to you, you offer fierce loyalty, protective warmth, and straightforward sincerity. You show care through honest presence and standing firmly by the people you trust.", practice: "Take time to refine how you speak, choosing words that illuminate rather than simply cut. Notice how your honesty shapes your interactions."}
Rohini: {status: "approved", core: "Your nature is rooted in gentle expansion and aesthetic pleasure. You seek steady creation and a deep appreciation for sensory comfort.", gifts: "Your gift is the ability to nurture ideas until they flourish. You bring a calm, steady approach to making things beautiful.", growth_edges: "At times your tendency is to cling tightly to familiar comfort. This can slow down the natural process of letting new things emerge.", at_work: "In work and study, you excel at building projects with enduring quality. You create environments that feel secure and pleasing.", in_relationships: "In close bonds, you offer a soothing presence that helps others feel safe. You value shared moments of quiet enjoyment.", practice: "Intentionally step outside one familiar routine this month and leave room for an unplanned sensory experience. Notice how fresh energy enters when you loosen your grip on comfort."}
Mrigashira: {status: "approved", core: "There is something gentle about your nature that drives you toward quiet exploration. You feel a deep curiosity about the unseen world around you.", gifts: "People rely on your soft touch and your inherent desire to discover new things. Your gentle approach opens doors to fresh perspectives.", growth_edges: "Sometimes you may become restless in your searching, wanting to explore every detail immediately. It is helpful to settle into one area before moving to the next.", at_work: "Where you work and study, you excel at investigating complex subjects with a delicate eye. You seek out hidden details that others overlook.", in_relationships: "Those close to you appreciate your curiosity and the soft way you engage with them. You offer a calm space for shared discovery.", practice: "Each evening, take time to notice the small, peaceful details of your immediate surroundings. This helps anchor your searching energy."}
Ardra: {status: "approved", core: "This star gives you a deep capacity for intense insight. You naturally experience renewal after periods of significant difficulty.", gifts: "A natural strength is the ability to grow through intense challenges. You find power in navigating difficult emotional storms.", growth_edges: "When pressure builds, your mind can amplify the storm into relentless over-analysis or sharp reactions. Slowing down lets clarity emerge without burning through your peace.", at_work: "Your best work comes when you use your sharp insight to clear complex problems. You excel at bringing clarity to turbulent situations.", in_relationships: "In friendship and love, you offer profound understanding to those around you. You help others see the clarity that emerges from inner turmoil.", practice: "When a wave of strong frustration or intensity hits, pause for three slow breaths before speaking or acting. Notice how much sharper your insight becomes once the first storm passes."}
Punarvasu: {status: "approved", core: "You are someone who embodies cycles of return and renewal. This placement brings a deep sense of hope and the capacity to start anew.", gifts: "You bring a generous spirit and a graceful ability to bounce back from setbacks. This energy fosters optimism in challenging times.", growth_edges: "Watch for the moment you give too much kindness without grounding it. This tendency can cause your energy to spread too thin.", at_work: "On the job, you excel at restarting projects when they stall. You use your optimism to inspire others toward fresh perspectives.", in_relationships: "With family and friends, you offer unwavering support and gentle encouragement. You create a space where others feel safe to begin again.", practice: "For a few minutes, focus your generous energy onto one specific task or person. This helps you anchor your hope in concrete action."}
Pushya: {status: "approved", core: "Deep down, you are driven by a need to provide comfort and sustained care for those around you. This placement establishes a deep instinct for nurturing environments.", gifts: "One of your strengths is your profound capacity for wisdom and gentle guidance. You naturally possess a steady, reliable presence for others.", growth_edges: "Your challenge is tending to the weight of responsibility you naturally carry. Learn to distinguish between necessary support and undue burden.", at_work: "You work best in roles that call for teaching, mentoring, or long-term stewardship. Your wisdom shines when you offer patient, consistent direction.", in_relationships: "In relationships, you naturally become the anchor that offers dependable solace. You offer deep, enduring support to your closest connections.", practice: "This week, practice consciously setting boundaries for commitments you cannot reasonably manage. Allow others to share the load sometimes."}
Ashlesha: {status: "approved", core: "Your essence is a deep, coiled wisdom that grants insight into the nature of others. This inner knowing forms a strong, protective shield around your core self.", gifts: "People notice your sharp intuition whenever you pick up subtle truths most miss. You have a quiet talent for reading underlying motives and deeper patterns.", growth_edges: "It helps to notice when your intuition becomes too guarded or protective. Be mindful not to withhold necessary truths out of caution.", at_work: "Colleagues and teachers notice your perceptive grasp of complex details. You show skill in uncovering underlying patterns within projects or studies.", in_relationships: "Once you choose to trust someone, you offer fierce loyalty and deep emotional closeness. You notice what your partner leaves unsaid and protect your inner circle wholeheartedly.", practice: "When you notice a feeling of guardedness, gently share the observation rather than holding the full depth of the feeling inside."}
Magha: {status: "approved", core: "You carry a deep connection to lineage, memory, and what came before you. This placement builds a foundation rooted in tradition and natural authority.", gifts: "Others notice your dignified presence and inherent sense of worth. This quality allows you to carry yourself with quiet assurance.", growth_edges: "Growth comes when you allow your pride to soften into acceptance of shared history. Be mindful of letting the weight of tradition become a barrier to new paths.", at_work: "In your work and projects, you approach tasks with a sense of royal duty. You naturally seek to establish a respected position within your field.", in_relationships: "The people near you feel the stability of your roots and respect your established bearing. They see a strong sense of inherited grace in your interactions.", practice: "Honour what shaped you, then intentionally try one fresh approach that breaks from your usual script. Notice how leadership deepens when dignity stays open to change."}
"Purva Phalguni": {status: "approved", core: "By nature you seek comfort and enjoyment in the world. You thrive when surrounded by warmth and pleasant company.", gifts: "Your quiet power manifests as a joyful and warm presence. You have a knack for finding pleasure in simple, lovely moments.", growth_edges: "When pushed, your tendency is to avoid necessary effort to maintain your ease. You might find it challenging to move forward when work requires sustained exertion.", at_work: "In any task, you approach it with a creative, warm perspective. You excel at tasks that allow for enjoyment and gentle interaction.", in_relationships: "When you love someone, you create an atmosphere of deep comfort. You naturally favor shared moments of warmth and relaxed companionship.", practice: "Each evening, take a moment to notice the small efforts you make. This gentle awareness helps you appreciate the satisfaction of completion."}
"Uttara Phalguni": {status: "approved", core: "You embody a spirit of dependable partnership and honourable commitment. This placement brings genuine kindness and a steady desire to stand by those around you.", gifts: "You shine through with a reliable nature that others depend upon. Your presence offers a comforting sense of steadfast friendship.", growth_edges: "The lesson here is to manage the impulse to take on too much responsibility. Learning to set gentle boundaries allows your support to remain sustainable.", at_work: "Given a goal, you bring dependable structure and long-term follow-through. You excel in roles built on clear agreements, steady leadership, and keeping teams aligned.", in_relationships: "Close to home, you offer unwavering loyalty to your loved ones. You create a safe space where others feel genuinely supported by you.", practice: "Before you start something new, pause to assess your capacity. Take a moment to check if adding this commitment will stretch your current resources."}
Hasta: {status: "approved", core: "Your nature shines through your ability to shape tangible things with skill. This placement brings practical cleverness and an easy sense of humour.", gifts: "Where you excel is in mastering fine manual tasks and resourceful problem-solving. You bring a practical intelligence to complex situations.", growth_edges: "Your growth lies in channeling your restless hands into focused projects rather than scattered efforts. Avoid starting too many things at once.", at_work: "In study and work, you thrive when applying your hands to craft or detailed execution. Your resourceful nature makes you adept at practical tasks.", in_relationships: "Your loved ones experience your gentle humour and your capacity for skillful support. You show affection through thoughtful, practical actions.", practice: "This week, dedicate time to completing one small, intricate project from start to finish. This helps ground your restless energy."}
Chitra: {status: "approved", core: "You have an unmistakable instinct for striking beauty and fine craftsmanship. Your nature is drawn to what is bold, polished, and brilliantly designed.", gifts: "A gift you carry is a keen creative eye for detail. You excel at bringing beautiful, shining ideas into tangible form.", growth_edges: "Under pressure, you may become overly focused on flawless execution. This tendency can lead to spending too much time refining small details.", at_work: "Your working style involves creating aesthetically pleasing projects. You naturally gravitate toward tasks that require meticulous attention to design.", in_relationships: "In love and friendship, you bring magnetic warmth and high standards. You thrive with partners who match your passion and value genuine depth beneath the surface polish.", practice: "This week, allow yourself to complete a project without seeking absolute perfection. Focus instead on finishing the creative vision."}
Swati: {status: "approved", core: "You move with an innate need to grow at your own rhythm and on your own terms. Like a young shoot in the wind, you bend, adapt, and shape your path as you go.", gifts: "Your best quality is your ability to remain adaptable in changing circumstances. This independence helps you navigate new environments with ease.", growth_edges: "Now and then, your drive for independent development can lead to moving too quickly. Learning to pause and observe can support deeper integration.", at_work: "Teams value your unique perspective and your capacity to adapt to shifting project demands. You show skill in finding personal ways to achieve goals.", in_relationships: "In close bonds, you offer a refreshing sense of freedom and mutual respect. You give the people you care about room to grow without pressure or control.", practice: "A small step is taking time to notice where you are currently planted. This gentle observation helps anchor your independent movement."}
Vishakha: {status: "approved", core: "Above all, you seek meaningful accomplishments and have a deep drive toward reaching a chosen goal. This placement grounds you in the pursuit of purpose and focused determination.", gifts: "You carry rare staying power and the courage to commit when a path forks. Once you choose a goal, you can rally sustained energy until the milestone is reached.", growth_edges: "Left unchecked, your single-mindedness can make you overlook necessary steps or opportunities. You might move forward so quickly that you miss the landscape around you.", at_work: "You work best when you are tackling projects that demand clear structure and a defined victory. This focus helps you achieve notable results in your studies and career.", in_relationships: "With those dear to you, you show a strong desire to support their ambitions and see them succeed. You focus your energy on building shared achievements.", practice: "It can help to pause regularly and acknowledge the wider context of your efforts. Take time to appreciate the journey as much as the destination."}
Anuradha: {status: "approved", core: "What defines you is a deep commitment to loyalty and lasting connection. You naturally cultivate bonds that endure through challenging periods.", gifts: "You are gifted at forming devoted friendships and maintaining steadfast loyalty. Your nature supports the creation of secure, reliable alliances.", growth_edges: "Be gentle when you internalize worry about the stability of your close connections. Allowing yourself to trust fully without guarding against disappointment can take time.", at_work: "In work and study, you show steady dedication to projects that demand patience and sustained effort. You excel at building dependable networks that last.", in_relationships: "In close bonds, you offer unwavering support and quiet devotion. You value emotional depth and the shared history built through thick and thin.", practice: "When quiet doubt creeps in about where you stand with someone, pause before pulling back. Offer one honest check-in and let steady action rebuild trust."}
Jyeshtha: {status: "approved", core: "Your spirit is that of a senior guardian who finds strength in taking on duties for others. You naturally embody a protective energy meant to safeguard those around you.", gifts: "What comes easily is the courage to assume significant responsibility for the welfare of others. You have a deep capacity to step into leadership roles when needed.", growth_edges: "Your edge is the tendency to carry too much weight, which can lead to feeling isolated at the top. Learning to share the burden is key.", at_work: "In work and projects, you excel at steering complex situations and standing firm under pressure. You bring strategic judgment and natural seniority to demanding roles.", in_relationships: "People close to you feel the strength of your fierce protectiveness and watchful care. You thrive in bonds where respect is mutual and you do not have to carry every burden alone.", practice: "Next time you feel the urge to take on a new responsibility, pause and ask if you can delegate a small part of the task."}
Mula: {status: "approved", core: "Inside you lives a profound need to investigate the foundations of existence. You seek the deep, hidden truths that lie beneath the surface of things.", gifts: "You bring a powerful ability to find the essential source of any situation. This allows you to uncover the core structure of any subject.", growth_edges: "Watch for the tendency to uproot your focus too rapidly when seeking answers. Allow yourself time to settle into the depths before moving on.", at_work: "At work and in study, you excel at thorough research and uncovering underlying patterns. You are suited to digging past superficial details to find the essential structure.", in_relationships: "With people you love, you value genuine connection built on shared understanding. You look for the deep, unchanging core of those bonds.", practice: "Once a day, pause to notice the physical sensations of the ground beneath your feet."}
"Purva Ashadha": {status: "approved", core: "Your nature is driven by an inspiring, invigorating energy that loves to move things forward. Like a strong current, your inner resolve clears doubt and builds momentum.", gifts: "Your gift is the ability to inspire others through your actions and words. You bring a powerful, revitalizing force to situations.", growth_edges: "At times your stubborn conviction can lead you to push forward with immense intensity. You might need to allow space for others to share the momentum.", at_work: "In work and study, you excel at initiating projects with powerful conviction. You have the capacity to motivate teams toward a shared goal.", in_relationships: "Those close to you feel the steady, inspiring flow of your energy. They benefit from your unwavering determination.", practice: "Today, try to pause before acting on a strong impulse to check if your energy is serving the situation."}
"Uttara Ashadha": {status: "approved", core: "At heart, you embody a deep commitment to lasting victory and integrity. You naturally seek outcomes that are principled and endure over time.", gifts: "Others notice your unwavering patience when facing long-term goals. This quality allows you to build achievements that have true substance.", growth_edges: "It helps to notice that your seriousness can sometimes feel too intense. Allowing for moments of softer expression supports your steady nature.", at_work: "Colleagues and peers notice your reliable, principled approach to demanding work. You build credibility by focusing on foundational truths rather than shortcuts.", in_relationships: "The people near you appreciate your steadfast character and calm demeanor. They value the dependable nature you bring to your connections.", practice: "Set aside time this week for something purely lighthearted with no goal or duty attached. Notice how allowing ease softens your intensity without weakening your resolve."}
Shravana: {status: "approved", core: "You seek deep understanding through attentive listening. This placement builds a natural path toward wisdom and the ability to bridge different people and perspectives.", gifts: "It comes naturally to listen with profound attention to the unspoken. You have a gift for absorbing knowledge and connecting ideas between different individuals.", growth_edges: "Sometimes you may take on too much emotional weight from what others share. This sensitivity can cause you to absorb concerns that are not yours.", at_work: "Whatever you take on, you excel at gathering information and synthesizing complex ideas. Your ability to listen makes you a strong resource for shared learning.", in_relationships: "In your closest circle, you offer a safe space for others to express themselves openly. You help foster deep bonds by truly hearing their perspectives.", practice: "After a heavy conversation, pause for a quiet minute and consciously separate what belongs to you from what belongs to the other person. Notice how clarity returns when you stop carrying extra weight."}
Dhanishta: {status: "approved", core: "This star gives you a deep sense of rhythm and abundance in your life. You naturally possess a talent for working harmoniously within groups.", gifts: "People rely on your generous spirit and your knack for bringing rhythm, timing, and lift to any room. Your presence makes others feel energized and valued.", growth_edges: "Growth comes when you focus your restless ambition into a single, sustained project. Avoid scattering your energy across too many new beginnings at once.", at_work: "In demanding roles, you excel at coordinating efforts and establishing a strong, rhythmic flow. You bring a vibrant energy to collaborative tasks.", in_relationships: "People close to you appreciate your warm generosity and dependable follow-through. You show care through shared activity, honest momentum, and backing the people you trust.", practice: "Set aside a dedicated time each day for quiet, focused creation. This helps anchor your energy and turn ambition into tangible results."}
Shatabhisha: {status: "approved", core: "You are someone who seeks quiet space to process the world around you. This placement drives a deep need for independent thought and a private search for what is true.", gifts: "A natural strength is restorative insight into complex situations. You have the ability to bring calm clarity after periods of deep reflection.", growth_edges: "Your challenge is to watch for the moment you pull away completely from connection. Allow yourself to remain present with others when you feel the urge to withdraw.", at_work: "Your best work comes from solitary periods of deep study or creative exploration. You excel when pursuing unique or unconventional ideas.", in_relationships: "In friendship and love, you value deep, meaningful connections over superficial interaction. You find solace in shared silence.", practice: "When you feel the impulse to pull completely into solitude, stay present for one honest conversation or send a brief check-in to someone you trust. Notice how connection can coexist with your independence."}
"Purva Bhadrapada": {status: "approved", core: "Deep down, you seek profound meaning and a powerful purpose in life. You feel a strong urge to transform things and bring passionate ideals into reality.", gifts: "One of your strengths is fiery idealism. You demonstrate a deep passion for causes you believe in and a strong drive to create significant change.", growth_edges: "When pushed, your desire for transformation may become rushed. Allow yourself time to fully observe the details before you move forward with a grand plan.", at_work: "In your work and projects, you approach tasks with intense conviction. You excel at inspiring others toward a shared vision.", in_relationships: "In close bonds, you bring fierce loyalty, emotional honesty, and bold encouragement. You thrive with people who appreciate your depth and share your appetite for genuine growth.", practice: "Once this week, pause before making a major decision to gently examine the foundation of your current intention."}
"Uttara Bhadrapada": {status: "approved", core: "Your essence is deep and calm, holding a steady inner strength that anchors you.", gifts: "Your quiet power arises from enduring pressure without immediate reaction. This deep patience grants you the ability to see things clearly.", growth_edges: "The lesson here is learning to release what you hold inside. Sometimes, the need to keep feelings contained can become a barrier.", at_work: "Colleagues and peers rely on your calm judgment under pressure. Taking a steady, deliberate pace allows you to build work that endures long after quick fixes fade.", in_relationships: "In relationships, you offer a reliable, grounded presence for others. You create a space where others can feel secure and calm.", practice: "When you notice you are holding tension, take a moment to gently name the feeling before letting it go."}
Revati: {status: "approved", core: "You carry a gentle nature that seeks to offer comfort and steady direction to those around you.", gifts: "You shine through as a kind guide who offers reliable care and a soft light for others.", growth_edges: "Your deep empathy can blur the line between helping others and carrying their journey for them. Learning to protect your own boundaries keeps your kindness sustainable.", at_work: "In any task, you bring a soothing touch that helps others navigate complex information safely.", in_relationships: "When you love someone, you naturally become a calm anchor for them, offering a secure space to rest.", practice: "Before stepping in to soothe or carry someone else's problem this week, pause and check your own energy first. Notice how clear boundaries make your guidance steadier and kinder."}
