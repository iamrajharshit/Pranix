Sun: {status: "approved", core: "Your nature is driven by a deep need to illuminate your path for others. You seek to establish your presence and lead with a strong sense of personal truth.", gifts: "Your gift is the ability to inspire confidence in those around you. This inherent vitality allows you to bring clarity and warmth to any situation.", growth_edges: "At times your pride or desire to lead can make it hard to share credit or hear quiet feedback. Remembering that real authority does not require constant spotlight keeps your warmth clear.", at_work: "In work and study, you shine brightest when you can take genuine ownership and set a clear standard. You naturally gravitate toward roles where decisive direction and integrity matter.", in_relationships: "In close bonds, you offer a powerful, warm presence that draws people in. You need to ensure your personal light does not overshadow the needs of those near you.", practice: "Each evening, try noticing accomplishments that are not about your own visibility. Focus instead on the quiet successes of those around you."}
Moon: {status: "approved", core: "What drives you is a search for deep emotional security and a sense of belonging. You navigate the world by tuning into the feelings of others around you.", gifts: "People notice your instinct to sense and understand what someone else is going through. Your natural empathy allows you to build genuine trust on a deep emotional level.", growth_edges: "Sometimes you may find your emotional state shifts quickly without warning. Learning to anchor your feelings in a steady place can help stabilize your inner world.", at_work: "Where you work and study, you perform best in environments built on trust and genuine warmth. You thrive when your efforts contribute to a supportive atmosphere for the people around you.", in_relationships: "Those close to you often look to you for comfort and reassurance. You provide a space where vulnerability feels safe and accepted.", practice: "Set aside a quiet minute each morning to check in with your own mood before absorbing anyone else's energy. This steady daily habit helps you stay anchored when emotional tides shift."}
Mars: {status: "approved", core: "This placement gives you a deep inner drive to move forward. You feel a powerful need to initiate things and push past obstacles.", gifts: "A natural strength is your ability to act with conviction and resolve. This inner fire helps you face challenges head-on.", growth_edges: "Growth comes when you learn to temper your haste and wait for the right moment. Learning to slow down allows your powerful energy to be more effective.", at_work: "Your best work comes when you take the lead in projects requiring bold execution. You show up ready to tackle difficult tasks with determination.", in_relationships: "In friendship and love, you bring a passionate intensity to your connections. You seek dynamic interactions that challenge your perspective.", practice: "The next time you begin an action, notice the urge to hurry. Give yourself time to consider the sequence of events prior to moving."}
Mercury: {status: "approved", core: "You are someone who seeks deep comprehension of the world around you. Your nature involves carefully processing information before you share your thoughts.", gifts: "You bring quick, precise thinking and sharp verbal agility to every situation. This gift allows you to untangle complex ideas and express them with ease.", growth_edges: "Watch for the tendency to analyze every detail until it becomes overwhelming. Allowing yourself to move past endless scrutiny helps you find ease.", at_work: "In your work and projects, you excel at organizing data and formulating logical arguments. Your ability to communicate nuanced concepts makes you a reliable source of insight.", in_relationships: "With the people you love, you offer thoughtful perspectives that help them see things clearly. You share your understanding in a way that builds mutual respect.", practice: "This week, try setting a specific time limit for deep thinking sessions. This gentle boundary helps you release the need to constantly review everything."}
Jupiter: {status: "approved", core: "Deep down, you are guided by a search for lasting wisdom, purpose, and ethical alignment. This placement inspires a generous outlook that looks for larger meaning in every chapter of life.", gifts: "One of your strengths is a broad perspective on life. You have an innate ability to see the larger framework of any situation.", growth_edges: "Your challenge is expanding your scope too far into every area. Be mindful of stretching your energy too thin across many ventures.", at_work: "You work best when teaching or exploring complex concepts. Your mind thrives when you are learning new philosophies or systems.", in_relationships: "In relationships, you offer a comforting sense of optimism. You naturally encourage others to look toward hopeful futures.", practice: "When you notice you are overextending, take time to choose one area to focus on deeply. Dedicate attention to mastering a single subject before moving on."}
Venus: {status: "approved", core: "Your essence is drawn toward beauty, refined pleasure, and genuine harmony in how you live. You naturally cultivate warmth, artistry, and meaningful connection wherever you place your heart.", gifts: "You shine through when you bring a soothing presence to situations. This placement offers a genuine warmth that makes people feel cared for.", growth_edges: "It helps to notice that you sometimes prioritize settling into ease over pushing forward. You may find comfort more appealing than active expansion.", at_work: "In work and study, you bring refined taste, diplomacy, and an eye for what makes an experience feel cohesive. You excel in creative or collaborative settings where goodwill and quality both matter.", in_relationships: "The people near you feel your affectionate nature instantly. You create an atmosphere where shared beauty and mutual understanding thrive.", practice: "Once a week, step out of your comfort zone by taking on one fresh creative or practical stretch. Notice how gentle effort expands your confidence without taking away the ease you value."}
Saturn: {status: "approved", core: "You carry a deep need for structure and reliable foundations. You build your sense of security through consistent, deliberate action.", gifts: "Where you excel is through the quiet power you gain from enduring long periods of effort. This inner perseverance assists you in completing challenging tasks.", growth_edges: "When pushed, your tendency is to become overly serious or slow to adapt. You might find yourself carrying too much weight for others.", at_work: "In study and work, you approach tasks with discipline when a goal is set. You excel at building enduring systems that support long-term achievement.", in_relationships: "When you love someone, you offer dependable support and commitment. You show care by establishing a stable, trustworthy presence for them.", practice: "Every morning, take a few moments to notice what you are carrying today. Gently set aside time to release unnecessary burdens before they become heavy."}
Rahu: {status: "approved", core: "By nature you seek experiences outside your comfort zone. This drive pushes you toward new horizons and uncharted territories.", gifts: "A gift you carry is fearless originality and the knack for spotting unconventional paths others overlook. This energy fuels rapid adaptation and bold breakthroughs in unfamiliar territory.", growth_edges: "Your challenge is noticing when healthy ambition turns into restless hunger that rarely feels satisfied. Pausing to digest what you have already built keeps novelty from scattering your focus.", at_work: "Given a goal, you approach it with intense curiosity. You thrive when tackling projects that require learning new skills.", in_relationships: "In close bonds, you bring magnetic curiosity and an openness to unconventional perspectives. Staying genuinely present with the people you care about keeps excitement from overriding steady trust.", practice: "Next time you feel restless, look around at your current environment. Grounding yourself in the present helps secure your expansive energy."}
Ketu: {status: "approved", core: "You embody a deep need to step away from external concerns. This inner turning allows you to see the underlying patterns of life clearly.", gifts: "Your best quality is profound insight into hidden truths. You gain the ability to perceive what truly matters beyond the surface.", growth_edges: "Because detaching comes easily to you, your growth edge is staying engaged when ordinary life feels noisy or repetitive. Pulling back too quickly can leave you feeling disconnected from the people and work right in front of you.", at_work: "Your working style involves seeking deeper meaning in tasks rather than focusing on outcomes. You excel when you can observe systems from a detached perspective.", in_relationships: "Your loved ones benefit from your unique perspective on life's flow. You offer a space of quiet observation rather than constant engagement.", practice: "Once a day, anchor yourself in one simple, tangible moment—sharing a meal, finishing a hands-on task, or checking in warmly with someone close. Staying gently present in everyday life balances your natural detachment."}
