# planet_in_house: written by `pranix-ctl library import`.
# Change text through the review sheet, not by hand (plan section 18).
Sun:
  house_1: {status: "approved", text: "The Sun in the first house brings your sense of self to the front, so identity and vitality shape how you meet the world. It grows best when confidence does not depend on being noticed."}
  house_2: {status: "approved", text: "The Sun in the second house ties your sense of worth to what you build, value and say. Its growth lies in letting your values, rather than possessions, carry your dignity."}
  house_3: {status: "approved", text: "The Sun in the third house lights up courage, effort and self-expression, often through skills, writing or bold initiatives. It grows as effort becomes steady rather than a bid for recognition."}
  house_4: {status: "approved", text: "The Sun in the fourth house turns your light toward home, roots and an inner sense of belonging. Growth comes from finding your own centre without needing home to revolve around you."}
  house_5: {status: "approved", text: "The Sun in the fifth house shines through creativity, learning, play and the things you love to make. It matures as you create from joy, letting praise be welcome but not necessary."}
  house_6: {status: "approved", text: "The Sun in the sixth house brings purpose to work, service and daily discipline, with a will to overcome obstacles. The growth edge is serving well without measuring your worth by effort alone."}
  house_7: {status: "approved", text: "The Sun in the seventh house brings your sense of self into partnership, where you meet yourself through others. It grows as you share the light in a bond rather than holding the centre."}
  house_8: {status: "approved", text: "The Sun in the eighth house turns your light toward depth, research and the hidden side of life, where change renews you. Its growth lies in trusting transformation instead of holding tight to control."}
  house_9: {status: "approved", text: "The Sun in the ninth house shines through principles, learning, teachers and the search for meaning. It matures as conviction stays open to other paths and to learning from others."}
  house_10: {status: "approved", text: "The Sun in the tenth house puts your light into work, responsibility and the role you play in public life. Growth comes from leading through contribution rather than through title alone."}
  house_11: {status: "approved", text: "The Sun in the eleventh house shines among friends, networks and shared goals, where effort can gather support. It grows as you lift the group rather than only your own aims."}
  house_12: {status: "approved", text: "The Sun in the twelfth house turns your light inward, toward rest, solitude, far places and the inner life. The growth edge is valuing quiet contribution as much as being seen."}
Moon:
  house_1: {status: "approved", text: "The Moon in the first house brings feelings close to the surface, so moods and sensitivity shape how you meet the world. It matures as you learn to anchor your inner weather without hiding it."}
  house_2: {status: "approved", text: "The Moon in the second house links emotional security to family, food, comfort and what you keep close. Its growth lies in feeling secure in yourself even when circumstances change."}
  house_3: {status: "approved", text: "The Moon in the third house brings a lively, changeable mind that loves to talk, write and stay in touch. It grows as curiosity settles into steady practice."}
  house_4: {status: "approved", text: "The Moon in the fourth house draws your feelings toward home, family and a deep need for emotional roots. Growth comes from carrying that sense of home within you wherever you go."}
  house_5: {status: "approved", text: "The Moon in the fifth house brings feeling into creativity, romance and play, with a tender bond to children and students. It matures as you share your heart freely without needing it returned in kind."}
  house_6: {status: "approved", text: "The Moon in the sixth house brings care into work and daily routines, and a wish to look after others. The growth edge is tending your own rhythms as kindly as you tend everyone else's."}
  house_7: {status: "approved", text: "The Moon in the seventh house seeks closeness and emotional warmth in partnership. It grows as you let a bond comfort you while keeping your own inner steadiness."}
  house_8: {status: "approved", text: "The Moon in the eighth house feels deeply and senses what lies beneath the surface of people and situations. Its growth lies in letting strong feelings move through you so they renew rather than overwhelm."}
  house_9: {status: "approved", text: "The Moon in the ninth house draws comfort from faith, learning, teachers and wide horizons. It matures as belief becomes a source of calm rather than rigid certainty."}
  house_10: {status: "approved", text: "The Moon in the tenth house brings care and public sensitivity to your work, often in roles that serve or nurture. Growth comes from letting your mood rest on more than how your work is received."}
  house_11: {status: "approved", text: "The Moon in the eleventh house finds comfort in friendship, community and shared hopes. It grows as you choose circles that nourish you rather than ones you feel obliged to please."}
  house_12: {status: "approved", text: "The Moon in the twelfth house is drawn to quiet, imagination, retreat and a rich inner world. The growth edge is making restful solitude a source of renewal rather than escape."}
Mars:
  house_1: {status: "approved", text: "Mars in the first house brings drive, directness and physical energy to how you meet the world. It matures as boldness learns patience, so strength serves rather than pushes."}
  house_2: {status: "approved", text: "Mars in the second house puts energy into earning, building resources and speaking plainly. Its growth lies in choosing words with the same care you bring to effort."}
  house_3: {status: "approved", text: "Mars in the third house fuels courage, initiative and the will to try, practise and compete. It grows as daring is matched by follow-through."}
  house_4: {status: "approved", text: "Mars in the fourth house brings energy into home and family life, and a strong wish to protect your base. Growth comes from keeping home a place of calm rather than contest."}
  house_5: {status: "approved", text: "Mars in the fifth house brings fire to creativity, sport, play and romance. It matures as competitive spirit turns into wholehearted enjoyment of what you make."}
  house_6: {status: "approved", text: "Mars in the sixth house brings stamina for hard work and a fighting spirit that meets obstacles head-on. The growth edge is pacing effort so discipline stays sustainable."}
  house_7: {status: "approved", text: "Mars in the seventh house brings passion and directness into partnership and dealings with others. It grows as honesty is paired with patience, so strong feelings build a bond rather than strain it."}
  house_8: {status: "approved", text: "Mars in the eighth house brings intensity, courage under pressure and a drive to understand what lies beneath. Its growth lies in channelling strong energy into research, renewal and steady change."}
  house_9: {status: "approved", text: "Mars in the ninth house stands up for strongly held beliefs and seeks adventure in learning and travel. It matures as conviction listens as well as it argues."}
  house_10: {status: "approved", text: "Mars in the tenth house brings ambition, decisiveness and energy to your work in the world. Growth comes from leading with steadiness, so drive inspires rather than overwhelms."}
  house_11: {status: "approved", text: "Mars in the eleventh house pursues goals energetically and rallies friends to a shared cause. It grows as you let others set the pace sometimes."}
  house_12: {status: "approved", text: "Mars in the twelfth house directs energy inward or toward far places, private effort and quiet service. The growth edge is finding healthy outlets so unspent energy does not turn restless."}
Mercury:
  house_1: {status: "approved", text: "Mercury in the first house brings a quick mind, curiosity and a youthful, communicative manner. It matures as thinking settles long enough to go deep."}
  house_2: {status: "approved", text: "Mercury in the second house brings skill with words, trade and practical value. Its growth lies in letting speech be kind as well as clever."}
  house_3: {status: "approved", text: "Mercury in the third house loves to learn, write, talk and connect, with a nimble, inventive mind. It grows as many interests are focused into a few you master."}
  house_4: {status: "approved", text: "Mercury in the fourth house brings learning into the home and a mind that likes a settled place to think. Growth comes from sharing thoughts at home as openly as feelings."}
  house_5: {status: "approved", text: "Mercury in the fifth house brings playful intelligence to study, creative writing and games of skill. It matures as cleverness is put in service of real understanding."}
  house_6: {status: "approved", text: "Mercury in the sixth house brings analytical skill to work, problem-solving and practical routines. The growth edge is knowing when a task is good enough to let go."}
  house_7: {status: "approved", text: "Mercury in the seventh house seeks conversation and a meeting of minds in partnership and trade. It grows as you listen as carefully as you explain."}
  house_8: {status: "approved", text: "Mercury in the eighth house brings a probing mind drawn to research, hidden patterns and difficult questions. Its growth lies in sharing what you discover instead of keeping it close."}
  house_9: {status: "approved", text: "Mercury in the ninth house thinks about meaning, learns from teachers and enjoys comparing ideas and traditions. It matures as knowledge deepens into wisdom you live by."}
  house_10: {status: "approved", text: "Mercury in the tenth house brings communication, analysis and adaptability to your work in the world. Growth comes from letting a clear purpose guide your many skills."}
  house_11: {status: "approved", text: "Mercury in the eleventh house builds networks through ideas, conversation and shared projects. It grows as you choose depth in a few connections over breadth in many."}
  house_12: {status: "approved", text: "Mercury in the twelfth house turns thought inward, toward imagination, reflection and quiet study. The growth edge is giving your inner ideas a form others can share."}
Jupiter:
  house_1: {status: "approved", text: "Jupiter in the first house brings warmth, optimism and a generous presence that others tend to trust. It matures as broad vision is matched by care for small details."}
  house_2: {status: "approved", text: "Jupiter in the second house tends to widen resources and brings wisdom to speech and family values. Its growth lies in sharing generously without overextending."}
  house_3: {status: "approved", text: "Jupiter in the third house brings an encouraging voice and a love of learning, writing and teaching others. It grows as good intentions turn into consistent effort."}
  house_4: {status: "approved", text: "Jupiter in the fourth house can bring a sense of blessing to home, learning and inner contentment. Growth comes from turning comfort into a base to build from, not a reason to stay still."}
  house_5: {status: "approved", text: "Jupiter in the fifth house brings wisdom to learning, creativity and the guidance of children and students. It matures as you teach by example as much as by advice."}
  house_6: {status: "approved", text: "Jupiter in the sixth house brings goodwill to service, work and the patient handling of obstacles. The growth edge is helping others without taking on more than you can carry."}
  house_7: {status: "approved", text: "Jupiter in the seventh house seeks partners who share values and growth, and brings generosity to relationships. It grows as you let others be themselves rather than who you hope they are."}
  house_8: {status: "approved", text: "Jupiter in the eighth house brings faith through change and an interest in deeper truths and shared resources. Its growth lies in trusting renewal without needing all the answers."}
  house_9: {status: "approved", text: "Jupiter in the ninth house turns naturally toward learning, teachers, faith and the search for meaning. It matures as wisdom stays humble and open to fresh questions."}
  house_10: {status: "approved", text: "Jupiter in the tenth house brings integrity and a guiding role to your work and reputation. Growth comes from leading with principle while staying approachable."}
  house_11: {status: "approved", text: "Jupiter in the eleventh house tends to widen circles of friends and supports hopes through goodwill. It grows as you share gains with the people who helped you reach them."}
  house_12: {status: "approved", text: "Jupiter in the twelfth house brings compassion, spiritual interest and a generosity that often works quietly. The growth edge is giving freely while keeping your own needs in view."}
Venus:
  house_1: {status: "approved", text: "Venus in the first house brings grace, charm and an eye for beauty to how you present yourself. It matures as you value inner harmony as much as outer appeal."}
  house_2: {status: "approved", text: "Venus in the second house brings pleasant speech, refined taste and comfort with beautiful things and good food. Its growth lies in enjoying what you have without needing more."}
  house_3: {status: "approved", text: "Venus in the third house brings charm to communication, art and creative skills, and warmth with siblings and neighbours. It grows as talent is given regular practice."}
  house_4: {status: "approved", text: "Venus in the fourth house brings beauty and comfort to home, and a wish for harmony in family life. Growth comes from keeping peace honest rather than only pleasant."}
  house_5: {status: "approved", text: "Venus in the fifth house brings joy to romance, art, play and creative expression. It matures as pleasure deepens into lasting creative work."}
  house_6: {status: "approved", text: "Venus in the sixth house brings grace to service and a wish for harmony in work and routines. The growth edge is meeting friction directly instead of smoothing it over."}
  house_7: {status: "approved", text: "Venus in the seventh house seeks beauty, affection and balance in partnership. It grows as you give in a bond without losing your own tastes and needs."}
  house_8: {status: "approved", text: "Venus in the eighth house brings depth to intimacy and an interest in shared resources and hidden beauty. Its growth lies in trusting closeness that changes you."}
  house_9: {status: "approved", text: "Venus in the ninth house finds beauty in learning, culture, travel and faith. It matures as appreciation for many traditions deepens into a philosophy of your own."}
  house_10: {status: "approved", text: "Venus in the tenth house brings diplomacy, taste and a pleasant manner to your work and public life. Growth comes from pairing grace with the courage to make hard calls."}
  house_11: {status: "approved", text: "Venus in the eleventh house tends to bring warm friendships and gains through goodwill and shared interests. It grows as you choose friends for depth as well as ease."}
  house_12: {status: "approved", text: "Venus in the twelfth house brings quiet pleasures, imagination, devotion and comfort in private spaces. The growth edge is letting rest restore you without drifting into indulgence."}
Saturn:
  house_1: {status: "approved", text: "Saturn in the first house brings seriousness, patience and a strong sense of responsibility to how you meet the world. It matures as discipline makes room for lightness and self-kindness."}
  house_2: {status: "approved", text: "Saturn in the second house tends to build resources slowly and values careful speech and thrift. Its growth lies in trusting that steady effort is enough, without holding on too tightly."}
  house_3: {status: "approved", text: "Saturn in the third house brings persistence to skills, effort and communication, often improving with age. It grows as patience replaces self-doubt in what you attempt."}
  house_4: {status: "approved", text: "Saturn in the fourth house brings responsibility to home and family, and a need to build inner security step by step. Growth comes from letting comfort in as well as duty."}
  house_5: {status: "approved", text: "Saturn in the fifth house brings seriousness to learning, creativity and children, and a wish to master a craft. It matures as you allow yourself to play while you practise."}
  house_6: {status: "approved", text: "Saturn in the sixth house brings endurance, method and a steady hand to work and daily routines. The growth edge is resting as faithfully as you work."}
  house_7: {status: "approved", text: "Saturn in the seventh house takes partnership seriously, valuing loyalty, maturity and commitment. It grows as patience in a bond is matched by warmth."}
  house_8: {status: "approved", text: "Saturn in the eighth house brings endurance through change and a sober interest in deeper questions. Its growth lies in meeting transformation step by step rather than bracing against it."}
  house_9: {status: "approved", text: "Saturn in the ninth house tests beliefs through experience and values tradition and earned wisdom. It matures as faith becomes something you have lived rather than inherited."}
  house_10: {status: "approved", text: "Saturn in the tenth house builds a career through patience, responsibility and long effort. Growth comes from measuring progress over years rather than months."}
  house_11: {status: "approved", text: "Saturn in the eleventh house tends to bring gains that arrive steadily and friendships that last. It grows as you trust slow results and keep long-term aims in view."}
  house_12: {status: "approved", text: "Saturn in the twelfth house brings discipline to solitude, quiet work and the inner life. The growth edge is letting go of old burdens so retreat feels restful rather than heavy."}
Rahu:
  house_1: {status: "approved", text: "Rahu in the first house brings a hunger to reinvent yourself and stand out in unusual ways. It matures as the drive to prove yourself settles into a self you are at ease with."}
  house_2: {status: "approved", text: "Rahu in the second house brings strong desire around resources, food and speech, and unusual ways of earning. Its growth lies in knowing when enough is enough."}
  house_3: {status: "approved", text: "Rahu in the third house fuels bold initiative, unconventional skills and a fearless voice. It grows as daring is guided by a clear aim."}
  house_4: {status: "approved", text: "Rahu in the fourth house brings restlessness around home and roots, and a search for a place that truly feels settled. Growth comes from building contentment within rather than chasing it outside."}
  house_5: {status: "approved", text: "Rahu in the fifth house brings unusual creativity, intense interests and a hunger for recognition through ideas. It matures as passion for novelty turns into lasting creative work."}
  house_6: {status: "approved", text: "Rahu in the sixth house brings an unusual drive to overcome obstacles and excel at demanding work. The growth edge is competing with your own best rather than with others."}
  house_7: {status: "approved", text: "Rahu in the seventh house is drawn to unconventional partners and intense one-to-one bonds. It grows as fascination with a bond deepens into steady trust."}
  house_8: {status: "approved", text: "Rahu in the eighth house draws you toward hidden knowledge, research and sudden turning points. Its growth lies in meeting change with curiosity and a steady centre."}
  house_9: {status: "approved", text: "Rahu in the ninth house questions inherited beliefs and seeks wisdom from unusual teachers and far places. It matures as exploration leads to principles you truly hold."}
  house_10: {status: "approved", text: "Rahu in the tenth house brings strong ambition and a drive to make a mark in public life. Growth comes from keeping ambition tied to values, so success feels meaningful."}
  house_11: {status: "approved", text: "Rahu in the eleventh house widens networks and fuels big goals shared with groups. It grows as you pursue aims that serve the community as well as yourself."}
  house_12: {status: "approved", text: "Rahu in the twelfth house is drawn to foreign lands, dreams, imagination and the hidden side of life. The growth edge is grounding inner exploration in everyday routines."}
Ketu:
  house_1: {status: "approved", text: "Ketu in the first house brings a detached, inward quality to how you meet the world, with little need to impress. It matures as you stay present in your own life while keeping that inner freedom."}
  house_2: {status: "approved", text: "Ketu in the second house loosens attachment to possessions and tends toward simple speech. Its growth lies in tending practical resources even when they feel unimportant."}
  house_3: {status: "approved", text: "Ketu in the third house brings intuitive skills and a quiet courage that needs little applause. It grows as you share ideas you might otherwise keep to yourself."}
  house_4: {status: "approved", text: "Ketu in the fourth house brings a sense that home lies within rather than in one place. Growth comes from still putting down roots where you are."}
  house_5: {status: "approved", text: "Ketu in the fifth house brings intuitive intelligence and creativity from a deep, quiet source. It matures as you let yourself enjoy what you make rather than moving straight on."}
  house_6: {status: "approved", text: "Ketu in the sixth house brings a quiet ability to handle obstacles and serve without fuss. The growth edge is giving daily routines your full attention."}
  house_7: {status: "approved", text: "Ketu in the seventh house brings a detached quality to partnership, valuing space and inner connection. It grows as you stay engaged in a bond rather than stepping back too soon."}
  house_8: {status: "approved", text: "Ketu in the eighth house brings deep intuition and an ease with the hidden, changing side of life. Its growth lies in staying grounded while exploring what lies beneath."}
  house_9: {status: "approved", text: "Ketu in the ninth house brings a personal, intuitive faith that may question formal doctrine. It matures as inner wisdom is shared with humility."}
  house_10: {status: "approved", text: "Ketu in the tenth house brings detachment from status and a wish for work that feels meaningful. Growth comes from committing to a role even when recognition feels unimportant."}
  house_11: {status: "approved", text: "Ketu in the eleventh house loosens attachment to gains and large circles, preferring a few true friends. It grows as you keep goals alive while holding them lightly."}
  house_12: {status: "approved", text: "Ketu in the twelfth house turns naturally toward solitude, reflection and the spiritual side of life. The growth edge is bringing that inner peace into ordinary days."}
