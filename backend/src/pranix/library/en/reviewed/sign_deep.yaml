Aries: {status: "approved", core: "Your instinct is to break fresh ground and take the lead. You carry a pioneering spirit that thrives on making the first bold move in any undertaking.", gifts: "Your gift is a vibrant energy that brings immediate action to ideas. You show a powerful ability to start things with enthusiasm and speed.", growth_edges: "At times your eagerness can cause you to move too quickly without fully considering the next step. Allowing space for thoughtful pauses helps you sustain your momentum.", at_work: "In work and study, you excel when you are the one setting the agenda. You thrive in roles that require you to launch projects from the ground up.", in_relationships: "In close bonds, you offer a dynamic presence that encourages others to move forward. Your honest feelings allow you to connect deeply with those you trust.", practice: "It can help to take a moment before reacting to a sudden impulse. Consciously choosing when to wait can refine your powerful initial energy."}
Taurus: {status: "approved", core: "This placement gives you a deep need for tangible comfort and sensual pleasure. Your essential nature settles into routines that provide profound internal safety and security.", gifts: "People rely on your calm presence and your steady, reliable nature. You have a talent for cultivating lasting beauty and creating things that endure over time.", growth_edges: "Sometimes you resist needed shifts once your comfort zone feels settled. Holding onto familiar structures too tightly can slow down your natural growth.", at_work: "Where you work and study, you excel when tasks involve material creation or steady administration. Your focus helps you build foundations that feel solid and real.", in_relationships: "Those close to you experience your gentle dependability as a source of deep reassurance. You offer a secure, beautiful space where others feel profoundly safe.", practice: "Once a week, intentionally switch up one small habit in your daily routine. This gentle flexibility helps loosen your grip on fixed patterns."}
Gemini: {status: "approved", core: "You are someone who naturally seeks out new information and ideas. Your core nature thrives on mental exploration and understanding complex concepts.", gifts: "A natural strength is your ability to connect disparate ideas quickly. You bring engaging wit and a lively curiosity to every situation.", growth_edges: "Growth comes when you allow yourself time to settle your thoughts. You might find yourself moving too fast before fully processing what you have learned.", at_work: "Your best work comes through engaging discussions and varied projects. You excel at learning new skills and communicating complex information clearly.", in_relationships: "In friendship and love, you enjoy sharing your thoughts and exploring new topics together. You bring a stimulating mental energy to those you care about.", practice: "Before you start something new, take a moment to define your main goal. This helps anchor your quick mind and allows you to focus your attention."}
Cancer: {status: "approved", core: "Deep down, you carry a profound need to safeguard your inner world and those you hold dear. You operate from a place of deep, tender emotional sensing.", gifts: "You bring a natural ability to create secure environments for others. Your core energy shines when you focus on nurturing places and people.", growth_edges: "Watch for the tendency to absorb the feelings of others and take on too much responsibility. Learning to set gentle boundaries helps you maintain your own space.", at_work: "In your work and studies, you bring a protective, attentive instinct to everything you steward. You excel at building supportive structures where teams and ideas can thrive.", in_relationships: "In close bonds, you offer a safe harbour for the people you love. You intuitively sense and respond to the emotional needs of those closest to you.", practice: "The next time you feel pulled to carry someone else's emotional weight, pause before stepping in. Gently check your own capacity and choose to hold your space first."}
Leo: {status: "approved", core: "Your essence carries a vibrant, radiant warmth that naturally lights up a room. You bring a dignified presence and heartfelt confidence that people instinctively notice.", gifts: "One of your strengths is your ability to inspire others through your genuine enthusiasm. You shine brightly when you choose to lead and offer generosity.", growth_edges: "Your challenge is noticing when your confidence leans too heavily on outside applause. Letting pride or the hunger for recognition steer your choices can cloud your natural warmth.", at_work: "You do your best work when you have the freedom to express a clear creative vision. You thrive in projects and studies where you can take real ownership and lead from the front.", in_relationships: "In relationships, you need to feel deeply respected by those around you. You find comfort when you can openly share what is in your heart.", practice: "This week, try acknowledging your own achievements without needing applause. Simply notice the accomplishments you make for yourself."}
Virgo: {status: "approved", core: "You carry a deep need to organize and refine your surroundings. This makes you naturally focused on making things precise and useful.", gifts: "Others notice your keen ability to observe small details. You bring a thoughtful approach that helps bring order to complex situations.", growth_edges: "It helps to notice when you start focusing too much on minor flaws. Allow yourself to step back and accept that not everything requires immediate correction.", at_work: "In any task, you show careful attention to detail. You shine when you restore clarity and serve a specific, practical function.", in_relationships: "People close to you appreciate your grounded dependability and quiet attentiveness. You show love through practical care—remembering the small details that make everyday life smoother.", practice: "A small step is to complete a task without seeking immediate perfection. Focus your attention on the process rather than the final outcome."}
Libra: {status: "approved", core: "Your nature is driven by the search for equilibrium in every situation. You seek to harmonize opposing forces through thoughtful interaction and measured responses.", gifts: "Your quiet power lies in your ability to mediate disagreements smoothly. You bring a gentle fairness to complex social dynamics and environments.", growth_edges: "Sometimes you hesitate over clear choices for fear of tipping the scales or disappointing someone. Carrying everyone else's comfort can leave your own priorities waiting on the sidelines.", at_work: "In your work and projects, you excel at creating harmonious collaborations with others. You build structures that feel balanced and aesthetically pleasing to everyone involved.", in_relationships: "With the people you love, you naturally ease friction by offering impartial perspectives. You find deep calm when interactions feel mutually fair and serene.", practice: "Once this week, make one clear decision based on your own preference without polling everyone around you first. Notice how honest clarity creates steadier harmony than quiet self-compromise."}
Scorpio: {status: "approved", core: "Your essence is profoundly perceptive and seeks understanding beneath the surface. You naturally move toward deep introspection to uncover hidden truths.", gifts: "You shine through your capacity to transform situations and renew your inner self. This depth allows you to navigate complex emotional landscapes with clarity.", growth_edges: "Watch for the tendency to hold onto intense emotions for too long. Allow yourself space to release the need for absolute control.", at_work: "You work best when you are investigating underlying systems or complex data. Your focus helps you uncover the essential structure of any project.", in_relationships: "People close to you rely on your sharp intuition to catch what goes unsaid. Once trust is earned, you offer fierce, unwavering loyalty and deep emotional presence.", practice: "When you notice your thoughts spiraling into intensity, try observing them from a gentle distance. This creates room for quiet acceptance."}
Sagittarius: {status: "approved", core: "By nature you approach life with open optimism and a deep desire to find purpose. Your core energy is driven by a constant search for larger meaning.", gifts: "Where you excel is inspiring others through your expansive vision and thirst for knowledge. Your bright energy encourages people to aim high.", growth_edges: "Your eagerness for the next horizon can tempt you to rush past practical details before a lesson fully lands. Slowing down helps turn bold vision into lasting mastery.", at_work: "Colleagues and peers notice your broad perspective when you share your insights. Your seeking nature helps frame new projects.", in_relationships: "When you love someone, you seek shared adventures and intellectual stimulation. You need space to explore together without feeling confined.", practice: "This week, stay with one practical detail or chapter all the way through before jumping to the next big idea. Notice how grounding your pace gives your vision real traction."}
Capricorn: {status: "approved", core: "You embody a deep sense of structure and commitment to long-term goals. You build your sense of self through patient, consistent effort and integrity.", gifts: "A gift you carry is the ability to remain composed under pressure. You find security when you establish a clear plan and watch progress unfold.", growth_edges: "The lesson here is to watch for when your approach to tasks becomes too rigid. Allow for flexibility when needed to maintain your forward momentum.", at_work: "Given a goal, you approach it with steady persistence and reliable execution. Your dedication creates lasting achievements.", in_relationships: "Close to home, you offer a dependable foundation for those around you. You show care by creating a secure space built on mutual understanding.", practice: "Once this week, leave a short block of time unscheduled or let a minor plan bend without forcing it back into line. Notice how deliberate flexibility keeps your long-term momentum steady."}
Aquarius: {status: "approved", core: "Above all, you are driven by a need to see unique perspectives. You naturally seek to stand apart while remaining connected to a larger community.", gifts: "Your inventive mind brings fresh ideas to every situation. You find ease when you explore new concepts and share your vision with others.", growth_edges: "Your growth lies in balancing your desire for detachment with the need for deep emotional connection. You might sometimes pull away too quickly from shared experiences.", at_work: "In study and work, you excel at developing innovative structures that benefit many people. You flourish when your thinking contributes to a collective goal.", in_relationships: "Your loved ones appreciate your unique outlook and your ability to maintain personal space. You show care through intellectual discussion and shared ideals.", practice: "The next time you feel the urge to step back into your head during a shared moment, stay present for one honest, unhurried check-in. Notice how emotional warmth can coexist with your independence."}
Pisces: {status: "approved", core: "What defines you is a deep, boundless compassion for the world around you. You experience life through a fluid, imaginative lens that seeks profound meaning.", gifts: "Your strength lies in sensing subtle emotional currents and nurturing creative ideas. You bring a gentle, artistic spirit to everything you approach.", growth_edges: "Under pressure, you may dissolve personal boundaries trying to absorb the feelings of everyone near you. You might struggle to hold onto your own distinct identity.", at_work: "Your working style thrives when you can explore abstract concepts and work in a supportive atmosphere. You find expression through intuitive, flowing methods.", in_relationships: "In love and friendship, you feel deeply for those you connect with and offer immense emotional support. You need space to process these intense feelings.", practice: "When a heavy mood fills the room, pause for a quiet moment and separate what belongs to you from what belongs to others. Clear emotional boundaries keep your compassion steady rather than draining."}
